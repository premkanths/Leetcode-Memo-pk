<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LeetCode Memory Hub Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fafafa;
    }
    .subtitle {
      font-size: 11px;
      color: #a1a1aa;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a1a1aa;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 8px 10px;
      color: #f4f4f5;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #8b5cf6;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .btn-primary:hover {
      filter: brightness(1.1);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #27272a;
      color: #e4e4e7;
      margin-top: 8px;
      font-size: 11px;
      padding: 7px;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.4;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: #71717a;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="title">LeetCode Memory Hub</div>
      <div class="subtitle">Official Sync Extension</div>
    </div>
  </div>

  <div class="form-group">
    <label for="hubUrl">Memory Hub App URL</label>
    <input type="text" id="hubUrl" placeholder="http://localhost:3000">
  </div>

  <div class="form-group">
    <label for="userId">Your User ID</label>
    <input type="text" id="userId" placeholder="Linked Firebase User ID">
  </div>

  <div class="form-group">
    <label for="username">LeetCode Username</label>
    <input type="text" id="username" placeholder="e.g. OHntGXNFKf">
  </div>

  <button id="syncBtn" class="btn btn-primary">
    <span>⚡ Sync Now to Hub</span>
  </button>

  <button id="saveBtn" class="btn btn-secondary">
    Save Credentials
  </button>

  <div id="status" class="status"></div>

  <div class="footer">
    Make sure you have a LeetCode tab open when clicking Sync!
  </div>

  <script src="popup.js"></script>
</body>
</html>
